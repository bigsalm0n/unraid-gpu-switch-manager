name: Versioned release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      tag: ${{ github.ref_name }}
  draft:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpu-switch-manager-${{ github.sha }}
          path: dist
      - name: Verify checksums and create the GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          assets=("./gpu-switch-manager-${TAG#v}.txz" ./gpu-switch-manager.plg ./SHA256SUMS ./release.json ./RELEASE-NOTES.md)
          flags=()
          if [[ $CHANNEL == candidate ]]; then flags+=(--prerelease); fi
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ $draft == true ]] || { echo "This release is already published" >&2; exit 1; }
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE-NOTES.md
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$TAG" --verify-tag --repo "$GITHUB_REPOSITORY" --draft "${flags[@]}" \
              --title "GPU Switch Manager $TAG" --notes-file RELEASE-NOTES.md "${assets[@]}"
          fi
